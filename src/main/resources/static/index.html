<!-- 
========================================================================
File: index.html
Description: The primary UI structure for the Camera App.

Overview:
This file sets up the DOM (Document Object Model) elements. In web dev, 
HTML provides the static structural objects (like the video player and 
buttons), and we link our JavaScript file at the end to inject the logic 
and handle user interactions.
======================================================================== 
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCP Virtual Try On Experience</title>

    <style>
        /*
         * CAMERA VIEWPORT
         * The wrapper provides the dark frame/border and gives us a reliable
         * positioning context for the offline placeholder message.
         */
        .video-frame {
            position: relative;
            width: 640px;
            height: 480px;
            max-width: calc(100vw - 32px);
            margin: 20px auto;
            overflow: hidden;
            background: #111;
            border: 8px solid #222;
            box-sizing: border-box;
        }

        /*
         * The actual video is stretched to fill the camera viewport while
         * preserving the camera's aspect ratio.
         */
        .video-frame video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #111;
        }

        /*
         * This message sits directly inside the video frame. It is visible
         * while the camera is offline and is hidden by camera.js once a
         * stream successfully starts.
         */
        #offlineMessage {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            color: #fff;
            background: rgba(0, 0, 0, 0.45);
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            pointer-events: none;
        }

        #toggleCamBtn,
        #captureBtn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #captureBtn {
            margin-left: 10px;
        }

        #toggleCamBtn.camera-running {
            background: #8b0000;
            color: #fff;
        }

        #photo {
            border: 1px solid #ccc;
            max-width: 100%;
        }
    </style>
</head>

<body style="text-align: center; font-family: sans-serif;">

    <h1>JCPenney Virtual Try On Experience</h1>
    <p>Team: Not a Bug, It's a Feature</p>

    <h2>Camera & AR Tracking Display</h2>

    <!-- VIDEO VIEWPORT: This wrapper creates the larger 640x480 camera frame.
         The 'autoplay' and 'playsinline' attributes ensure the stream 
         starts rendering immediately once the JavaScript connects it. -->
    <div class="video-frame">
        <video id="video" autoplay playsinline></video>

        <!-- OFFLINE STATUS: This remains centered inside the video frame until
             camera.js successfully initializes the hardware stream. -->
        <div id="offlineMessage" aria-live="polite">
            Camera Offline - Click Start to Initialize
        </div>
    </div>

    <!-- UI CONTROLS: A single VCR-style toggle button controls the complete
         camera lifecycle. The capture button remains independent. -->
    <div>
        <button id="toggleCamBtn" type="button">
            ▶️ Start Camera
        </button>
        <button id="captureBtn" type="button">
            📸 Take Picture
        </button>
    </div>

    <br><br>

    <!-- MEMORY BUFFER: A common web dev trick. We use a <canvas> element 
         but hide it from the UI (display:none). We use this hidden canvas 
         to grab and process the video frame data in the background. -->
    <canvas id="canvas" style="display:none;"></canvas>

    <!-- OUTPUT: The final destination where our captured image string will be pushed -->
    <img id="photo" alt="The screen capture will appear here">

    <!-- LOGIC LINK: We place the script tag at the bottom of the body 
         so the HTML elements fully load into the DOM before the JS tries 
         to manipulate them. -->

         <!-- Three.js Engine & GLTF Loader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

         <!-- Google MediaPipe ML Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <script src="api.js"></script>       <!-- 1. Backend communication methods -->
    <script src="camera.js"></script>    <!-- 2. Hardware stream initialization -->
    <script src="tracking.js"></script>  <!-- 3. Computer vision & spatial mapping -->
    <script src="renderer.js"></script>  <!-- 4. 3D Model generation & AR display -->
</body>
</html>
